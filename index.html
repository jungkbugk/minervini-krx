<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>국장 미너비니 상세 | 실전 운용 현황</title>
<style>body{background:#0b0f17;margin:0}#st{position:fixed;right:10px;bottom:8px;font:11px sans-serif;color:#8a97ad;background:rgba(16,21,34,.9);border:1px solid #243047;border-radius:8px;padding:4px 10px}#st.err{color:#ef5350}</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center;color:#8a97ad;font-family:sans-serif">데이터 불러오는 중…</p></div>
<div id="st">로딩 중</div>
<script>
  // 데이터는 Pages 빌드를 거치지 않는 'data' 브랜치에서 60초마다 직접 불러옵니다.
  const RAW = "https://raw.githubusercontent.com/jungkbugk/minervini-krx/data/kr_fragment.html";
  async function load() {
    const st = document.getElementById("st");
    try {
      const r = await fetch(RAW + "?t=" + Math.floor(Date.now() / 20000), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      document.getElementById("app").innerHTML = await r.text();
      st.className = ""; st.textContent = "자동 갱신 60초 · " + new Date().toLocaleTimeString("ko-KR");
    } catch (e) { st.className = "err"; st.textContent = "갱신 실패(" + e.message + ") · 재시도 중"; }
  }
  load(); setInterval(load, 60000);
</script>
</body>
</html>
