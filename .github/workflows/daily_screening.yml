name: Daily Minervini SEPA Screener & Dashboard Deploy

on:
  schedule:
    # 월~금 한국 시간 오후 4시 30분 (UTC 기준 07시 30분) 자동 무인 실행
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 지원

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  screen-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 마크 미너비니 SEPA 스크리너 실행 (전체 시장)
        run: |
          python minervini_screener.py --market ALL --min-rs 70 --min-val 5.0 --workers 16 --no-browser

      - name: 결과 파일 저장소에 자동 커밋 & 푸시
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html minervini_dashboard.html minervini_stocks_*.csv
          git commit -m "Auto Update: $(date +'%Y-%m-%d') 마크 미너비니 SEPA 대시보드 갱신" || echo "변경 사항 없음"
          git push
