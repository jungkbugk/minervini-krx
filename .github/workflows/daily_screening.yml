name: Daily Minervini SEPA Screener & Telegram Alert (Global)

on:
  schedule:
    # 1. 한국장 마감 후: 월~금 한국시간 16:30 (UTC 07:30) -> 국내 주식 자동 탐색
    - cron: '30 7 * * 1-5'
    # 2. 미국장 마감 후: 화~토 한국시간 06:30 (월~금 UTC 21:30) -> 미국 주식 자동 탐색
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: '실행할 시장 (KR / US / ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - KR
          - US

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  screen-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 스케줄에 따른 대상 시장 결정 (한국장 vs 미국장)
        id: select-market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ github.event.inputs.market }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 12 ]; then
              echo "market=US" >> $GITHUB_OUTPUT
            else
              echo "market=KR" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 마크 미너비니 SEPA 스크리너 실행 & 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python minervini_screener.py --market ${{ steps.select-market.outputs.market }} --workers 16 --no-browser

      - name: 결과 파일 저장소에 자동 커밋 & 푸시
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html minervini_dashboard.html minervini_stocks_*.csv history/
          git commit -m "Auto Update: $(date +'%Y-%m-%d') 마크 미너비니 글로벌 대시보드 갱신" || echo "변경 사항 없음"
          git push
